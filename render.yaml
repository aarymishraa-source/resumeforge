# Render.com deployment blueprint for ResumeForge
# Free tier web service running Flask via gunicorn.
#
# Note: Render's free tier filesystem is ephemeral, so resumes.db will reset
# on every deploy and after the service sleeps (~15 min of no traffic).
# To keep data permanently, attach a Render Disk (paid) or move to Postgres.

services:
  - type: web
    name: resumeforge
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
